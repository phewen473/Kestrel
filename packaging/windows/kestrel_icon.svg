<?xml version="1.0" encoding="UTF-8"?>
<!-- Kestrel application icon, concept 6 "Mast": a hovering kestrel over a lattice tower with radiating arcs. -->
<!-- Source artwork for kestrel.ico; make_icon.py renders it at every Windows icon size. Drawn on a 240 x 240 grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Rounded rufous tile: the icon's background -->
  <rect width="240" height="240" rx="52" fill="#C2562A"/>
  <!-- Cream line work: signal arcs and the tower -->
  <g fill="none" stroke="#F7E3CF" stroke-width="6" stroke-linecap="round">
    <!-- Inner arc, left side -->
    <path d="M87.1 109 A38 38 0 0 0 87.1 147"/>
    <!-- Inner arc, right side -->
    <path d="M152.9 109 A38 38 0 0 1 152.9 147"/>
    <!-- Outer arc, left side (fainter) -->
    <path d="M71.5 100 A56 56 0 0 0 71.5 156" opacity="0.55"/>
    <!-- Outer arc, right side (fainter) -->
    <path d="M168.5 100 A56 56 0 0 1 168.5 156" opacity="0.55"/>
    <!-- Lattice tower: mast top, two legs, two cross bars, an X brace and the base line -->
    <path d="M120 118 L120 140 M120 140 L94 210 M120 140 L146 210 M108 172 L132 172 M101 192 L139 192 M108 172 L139 192 M132 172 L101 192 M84 210 L156 210"/>
  </g>
  <!-- Hovering kestrel (front view, wings raised, tail fanned), scaled to sit above the mast -->
  <path transform="translate(66 18) scale(0.45)" fill="#1F3047" d="M120 62 C127 62 132 66 132 73 C132 79 130 83 130 86 L138 93 C160 82 186 66 206 52 L193 78 L202 80 L186 96 L193 99 L168 110 L146 118 L140 148 L156 186 Q138 198 120 198 Q102 198 84 186 L100 148 L94 118 L72 110 L47 99 L54 96 L38 80 L47 78 L34 52 C54 66 80 82 102 93 L110 86 C110 83 108 79 108 73 C108 66 113 62 120 62 Z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
